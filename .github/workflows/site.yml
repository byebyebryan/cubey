name: Cubey presentation site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/notes/cubey-site-content-map.json'
      - 'docs/architecture/gltf-assets.md'
      - '.github/workflows/site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/notes/cubey-site-content-map.json'
      - 'docs/architecture/gltf-assets.md'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.12.1'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Read Pages endpoint
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install locked dependencies
        run: npm ci
      - name: Check content, media, and static build
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run verify
      - name: Record deployed revision
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            writeFileSync("dist/metadata/deployment.json", JSON.stringify({
              commit: process.env.GITHUB_SHA,
              workflow: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              url: process.env.SITE_URL
            }, null, 2) + "\n");
          '
      - name: Upload static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
